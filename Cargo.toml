[workspace]
resolver = "3"
members = ["crates/shared", "crates/core", "crates/backend", "crates/frontend"]
# frontend hanya dibangun untuk wasm32 (lewat trunk), jadi tidak ikut `cargo test` biasa.
default-members = ["crates/shared", "crates/core", "crates/backend"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
shared = { path = "crates/shared" }
scanner-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["std"] }
polars = { version = "0.55", default-features = false, features = ["lazy", "rolling_window", "ewma", "dtype-date", "temporal", "abs", "fmt", "cum_agg"] }
yata = { version = "0.7", default-features = false, features = ["period_type_u16"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
axum = { version = "0.8", features = ["multipart"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "tls-none", "chrono", "json", "migrate", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
csv = "1"
